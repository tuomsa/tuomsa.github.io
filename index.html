<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 255, 200, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(120, 0, 255, 0.08) 0%, transparent 40%);
    }

    header {
      padding: 1.25rem 2rem;
      background: rgba(10, 10, 20, 0.8);
      border-bottom: 1px solid rgba(0, 255, 200, 0.3);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: #00ffc8;
      text-shadow: 0 0 10px rgba(0, 255, 200, 0.6);
    }

    header h1 span {
      color: #a855f7;
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
    }

    main {
      flex: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    #messages {
      flex: 1;
      min-height: 320px;
      max-height: 52vh;
      padding: 1.25rem;
      background: rgba(15, 15, 25, 0.7);
      border: 1px solid rgba(0, 255, 200, 0.25);
      border-radius: 12px;
      overflow-y: auto;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.05) inset;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }
    #messages::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 200, 0.4);
      border-radius: 3px;
    }

    .msg {
      margin-bottom: 1rem;
      padding: 0.8rem 1.1rem;
      border-radius: 10px;
      max-width: 82%;
      line-height: 1.5;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: linear-gradient(135deg, #00ffc8, #00d4aa);
      color: #0a0a0f;
      margin-left: auto;
      font-weight: 500;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.3);
    }

    .msg.bot {
      background: rgba(30, 30, 50, 0.8);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #e8e8e8;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
    }

    .chat-box {
      background: rgba(15, 15, 25, 0.6);
      border: 1px solid rgba(0, 255, 200, 0.2);
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(10px);
    }

    .chat-box label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #00ffc8;
      margin-bottom: 0.6rem;
    }

    .chat-box textarea {
      width: 100%;
      min-height: 90px;
      padding: 0.9rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 200, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.95rem;
      resize: vertical;
    }

    .chat-box textarea:focus {
      outline: none;
      border-color: #00ffc8;
      box-shadow: 0 0 12px rgba(0, 255, 200, 0.3);
    }

    .chat-box button {
      margin-top: 0.75rem;
      padding: 0.65rem 1.4rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1px;
      background: transparent;
      color: #00ffc8;
      border: 1px solid #00ffc8;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 0.5rem;
      transition: all 0.2s;
    }

    .chat-box button:hover {
      background: #00ffc8;
      color: #0a0a0f;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
    }

    .chat-box button.secondary {
      color: #a855f7;
      border-color: #a855f7;
    }

    .chat-box button.secondary:hover {
      background: #a855f7;
      color: #0a0a0f;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
    }

    #history {
      background: rgba(15, 15, 25, 0.6);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      padding: 1rem;
      backdrop-filter: blur(10px);
    }

    #history h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #a855f7;
      margin-bottom: 0.75rem;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
    }

    .history-item {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      font-size: 0.85rem;
      color: #bbb;
      transition: all 0.15s;
    }

    .history-item:hover {
      background: rgba(0, 255, 200, 0.08);
      color: #00ffc8;
      padding-left: 1rem;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <header>
    <h1>NEXUS <span>/(By Tuomas)/</span> CHAT</h1>
  </header>
  <main>
    <div id="messages"></div>

    <div class="chat-box">
      <label for="message">ASK ME ANYTHING</label>
      <textarea id="message" placeholder="Type your query..."></textarea>
      <button id="send">SEND</button>
      <button id="new-chat" class="secondary">NEW CHAT</button>
    </div>

    <div id="history">
      <h3>HISTORY</h3>
      <div id="history-list"></div>
    </div>
  </main>
  <footer>
    NEXUS // SYSTEM ONLINE
  </footer>

  <script src="chat.js"></script>
</body>
</html>
