<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS // Chat</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    :root {
      --bg: #0a0a0f;
      --text: #e0e0e0;
      --accent: #00ffc8;
      --accent2: #a855f7;
      --panel: rgba(15, 15, 25, 0.7);
      --user-bg: linear-gradient(135deg, #00ffc8, #00d4aa);
      --bot-bg: rgba(30, 30, 50, 0.8);
    }

    body.light {
      --bg: #f4f4f8;
      --text: #1a1a1a;
      --accent: #0066cc;
      --accent2: #7c3aed;
      --panel: rgba(255, 255, 255, 0.85);
      --user-bg: linear-gradient(135deg, #0066cc, #3b82f6);
      --bot-bg: #eee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .header-controls button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    main {
      flex: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #messages {
      flex: 1;
      min-height: 300px;
      max-height: 55vh;
      padding: 1rem;
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      overflow-y: auto;
      backdrop-filter: blur(8px);
    }

    .msg {
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      max-width: 85%;
      position: relative;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: var(--user-bg);
      color: #fff;
      margin-left: auto;
    }

    .msg.bot {
      background: var(--bot-bg);
      border: 1px solid var(--accent2);
    }

    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.3);
      border: none;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .msg.bot:hover .copy-btn { opacity: 1; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .suggestions button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.4rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .chat-box {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1rem;
    }

    .chat-box textarea {
      width: 100%;
      min-height: 80px;
      padding: 0.8rem;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      resize: vertical;
    }

    .chat-box button, .extra-btn {
      margin-top: 0.5rem;
      margin-right: 0.4rem;
      padding: 0.5rem 1rem;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #history, .settings {
      background: var(--panel);
      border: 1px solid var(--accent2);
      border-radius: 12px;
      padding: 1rem;
    }

    .history-item {
      padding: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .history-item:hover { background: rgba(0,255,200,0.08); }

    .settings textarea {
      width: 100%;
      min-height: 60px;
      margin-top: 0.4rem;
      padding: 0.5rem;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--accent2);
      color: var(--text);
      border-radius: 6px;
    }

    .typing {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1s infinite;
      margin: 0 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>NEXUS // CHAT</h1>
    <div class="header-controls">
      <button id="theme-toggle">LIGHT</button>
      <button id="export-btn">EXPORT</button>
    </div>
  </header>

  <main>
    <div id="messages"></div>

    <div class="suggestions">
      <button data-prompt="Explain quantum computing simply">Quantum computing</button>
      <button data-prompt="Write a short poem about AI">Poem about AI</button>
      <button data-prompt="Give me 5 startup ideas">Startup ideas</button>
      <button data-prompt="How does the internet work?">How internet works</button>
    </div>

    <div class="chat-box">
      <textarea id="message" placeholder="Type your message..."></textarea>
      <div>
        <button id="send">SEND</button>
        <button id="voice-btn">🎤 VOICE</button>
        <button id="new-chat" class="extra-btn">NEW CHAT</button>
        <button id="clear-history" class="extra-btn">CLEAR HISTORY</button>
      </div>
    </div>

    <div class="settings">
      <strong>System Prompt</strong>
      <textarea id="system-prompt">You are a helpful assistant.</textarea>
    </div>

    <div id="history">
      <h3>HISTORY</h3>
      <div id="history-list"></div>
    </div>
  </main>

  <script src="chat.js"></script>
</body>
</html>
